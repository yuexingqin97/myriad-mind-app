[package]
name = "myriad-mind-desktop"
version = "0.1.0"
description = "大衍决桌面端 — Tauri 2.x"
authors = ["myriad-mind"]
edition = "2024"
license = "MIT"

[lib]
name = "myriad_mind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
dotenvy = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Security_Credentials",
  "Win32_Foundation",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
